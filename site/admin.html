 $("#ab").onclick=e=>spin(e.currentTarget,async()=>{const name=$("#an").value.trim(),pin=ap.get();if(!name)return toast("Enter a name",1);if(pin.length<4)return toast("Enter a 4-digit PIN",1);
  try{await api("/api/admin",{op:"add",name,pin});await admins(()=>V!=="admins");$("#ok").innerHTML=`<div class=okbox>${ic("check",22)}<span>${esc(name)} added. PIN: <span style="letter-spacing:.2em">${esc(pin)}</span> — tell them now, it can't be shown again.</span></div>`}catch(x){toast(x.message,1)}})}
async function adminOp(t){const d=t.dataset,b={op:d.op,id:+d.id};
 if(d.op==="name"){const n=await textBox("Rename sub admin","New name",{ok:"Rename"});if(!n||!n.trim())return;b.name=n.trim()}
 if(d.op==="pin"){const r=await askPin("Set a new PIN",0,v=>api("/api/admin",{op:"pin",id:b.id,pin:v.pin}));if(r)toast("PIN reset");return}
 if(d.op==="active")b.active=+d.on;
 if(d.op==="del"&&!await confirmBox("Delete this sub admin?","They will be signed out and can no longer log in.","Delete",1))return;
 await spin(t,async()=>{try{await api("/api/admin",b);toast("Done");nav("admins")}catch(x){toast(x.message,1)}})}
async function log(stale){const L=await api("/api/log");if(stale())return;
 $("#main").innerHTML=`<div class=ph><div><h1>Activity</h1><p class="m sm">The latest 100 actions.</p></div>${L.length?`<button class="btn d" data-a=clr>${ic("trash",18)}Clear activity</button>`:""}</div><div class=list>${L.map(x=>`<div class="card it"><div class=bd><b style="white-space:normal">${esc(x.what)}</b><span>${esc(x.who)} · ${ago(x.at)}</span></div></div>`).join("")}</div>`}

const UL={go:"View Routine (daily)",wk:"Weekly Routine",cv:"Cover Page",fl:"Files",mr:"Main Routine",hw:"Homework",gl:"Group Links",tc:"Teachers",nt:"Notices",st:"Student List",fb:"Feedback button",gd:"Guide call"};
async function progress(stale){const[U,V]=await Promise.all([api("/api/usage"),api("/api/views")]);if(stale())return;
 const M=Object.fromEntries(U.map(x=>[x.k,x])),rows=Object.keys(UL).map(k=>({n:UL[k],t:+(M[k]||{}).t||0,w:+(M[k]||{}).w||0,td:+(M[k]||{}).td||0})).sort((a,b)=>b.t-a.t),mx=Math.max(1,...rows.map(r=>r.t));
 $("#main").innerHTML=`<div class=ph><div><h1>Progress</h1><p class="m sm">How often students open each section (one count per tap, counted from this update).</p></div></div><div class=stats><div class="card stat"><span>Page views</span><b>${V.total}</b><span class=m>Today: ${V.today}</span></div></div><div class=list>${rows.map(r=>`<div class="card it"><div class=bd style="width:100%"><b style="white-space:normal">${esc(r.n)}</b><span>Today ${r.td} · 7 days ${r.w} · Total ${r.t}</span><div style="height:6px;border-radius:6px;background:var(--hov);margin-top:8px"><div style="height:100%;width:${Math.round(r.t/mx*100)}%;border-radius:6px;background:currentColor;opacity:.55"></div></div></div></div>`).join("")}</div>`}
async function idcards(stale){
 const D2=await api("/api/idlog");if(stale())return;
 const B=new Set(D2.blocked.map(x=>x.ip)),tab=ss.get("cr_idtab")==="b"?"b":"l";
 const kind={dl:"PDF",di:"Image",pr:"Print",rej:"REJECTED - bad / inappropriate name"};
 const draw=()=>{
  const L=D2.log,Bk=D2.blocked;
  $("#main").innerHTML=`<div class=ph><div><h1>ID Cards</h1><p class="m sm">Who made an ID card (name, roll, IP). Block an IP to stop a person from making cards - they will see "contact the admin". Shared Wi-Fi / mobile networks can share one IP, so check before blocking.</p></div>${L.length?`<button class="btn d" data-a=clr>${ic("trash",18)}Clear log</button>`:""}</div>
  <div class="card pad" style="margin-bottom:12px"><b>Card template (private)</b><p class="m sm" style="margin:4px 0 10px">The real ID card design is kept on the server and given only to people who pass the check - so nobody can make a card by editing the page's code. Upload the two JPG files once (1024 x 1536).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-tp=f>${D2.tpl&&D2.tpl.f?"✓ Front uploaded - replace":"Upload front (missing!)"}</button><button class="btn" data-tp=b>${D2.tpl&&D2.tpl.b?"✓ Back uploaded - replace":"Upload back (missing!)"}</button></div><input type=file id=tpf accept="image/jpeg" hidden></div>
  <div class=ph style="gap:8px;justify-content:flex-start"><button class="btn ${tab==="l"?"p":""}" data-t=l>Cards made (${L.length})</button><button class="btn ${tab==="b"?"p":""}" data-t=b>Blocked IPs (${Bk.length})</button></div>
  <div class=list>${tab==="l"?(L.length?L.map(x=>`<div class="card it"><div class=bd style="width:100%"><b style="white-space:normal">${esc(x.name)} · Roll ${esc(x.roll)}</b><p style="margin:4px 0;word-break:break-word">Father: ${esc(x.father)} · Mother: ${esc(x.mother)}${x.tech?" · "+esc(x.tech):""}${x.sess?" · "+esc(x.sess):""}</p><span>${ago(x.at)} · ${x.act==="rej"?`<b style="color:var(--bad)">${esc(kind.rej)}</b>`:esc(kind[x.act]||"")} · IP <b>${esc(x.ip)}</b>${B.has(x.ip)?' · <b style="color:var(--bad)">BLOCKED</b>':""}</span><p class="m sm" style="margin:4px 0;word-break:break-word">${esc(x.ua)}</p><div style="margin-top:6px">${B.has(x.ip)?`<button class="btn" data-un="${esc(x.ip)}">Unblock</button>`:`<button class="btn d" data-bl="${esc(x.ip)}">${ic("off",16)}Block this IP</button>`}</div></div></div>`).join(""):`<div class="card pad m">No ID card has been made yet.</div>`):(Bk.length?Bk.map(x=>`<div class="card it"><div class=bd style="width:100%"><b>${esc(x.ip)}</b><p style="margin:4px 0;word-break:break-word">${esc(x.reason||"No reason written")}</p><span>${ago(x.at)} · by ${esc(x.by||"")}</span><div style="margin-top:6px"><button class="btn" data-un="${esc(x.ip)}">Unblock</button></div></div></div>`).join(""):`<div class="card pad m">No IP is blocked.</div>`)}</div>`;
  $("#main").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ss.set("cr_idtab",b.dataset.t);nav("idcards")});
  const tpf=$("#tpf");let tk="";
  $("#main").querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{tk=b.dataset.tp;tpf.value="";tpf.click()});
  tpf.onchange=()=>{const f=tpf.files&&tpf.files[0];if(!f)return;
   if(f.type!=="image/jpeg"){toast("Choose a JPG image",1);return}
   if(f.size>1024*1024){toast("File must be under 1 MB",1);return}
   const rd=new FileReader();rd.onload=async()=>{try{await api("/api/idtpl",{k:tk,data:String(rd.result).split(",")[1]});toast("Template uploaded");nav("idcards")}catch(x){toast(x.message,1)}};rd.readAsDataURL(f)};
  $("#main").querySelectorAll("[data-bl]").forEach(b=>b.onclick=async()=>{const ip=b.dataset.bl,r=await textBox("Block "+ip,"Reason (only you see this)",{ok:"Block",ph:"e.g. fake name / bad photo"});if(r===null||r===undefined)return;
   await spin(b,async()=>{try{await api("/api/idblock",{ip,reason:r});toast("Blocked");nav("idcards")}catch(x){toast(x.message,1)}})});
  $("#main").querySelectorAll("[data-un]").forEach(b=>b.onclick=async()=>{await spin(b,async()=>{try{await api("/api/idunblock",{ip:b.dataset.un});toast("Unblocked");nav("idcards")}catch(x){toast(x.message,1)}})});
  const c=$("#main").querySelector("[data-a=clr]");if(c)c.onclick=async()=>{if(!await confirmBox("Clear the ID card log?","All names and IPs in this list will be deleted. Blocked IPs stay blocked.","Clear",1))return;try{await api("/api/idlog/clear",{});toast("Cleared");nav("idcards")}catch(x){toast(x.message,1)}}};
 draw()}
async function feedback(stale){const L=await api("/api/feedbacks");if(stale())return;
 const list=()=>{$("#main").innerHTML=`<div class=ph><div><h1>Feedback</h1><p class="m sm">${L.length} message${L.length==1?"":"s"} from students. Tap one to see the details.</p></div></div><div class=list>${L.length?L.map((x,i)=>`<div class="card it" data-fi=${i} style="cursor:pointer"><div class=bd style="width:100%"><b style="white-space:normal">${esc(x.name||"")} · ${esc(x.g)} · Roll ${esc(x.roll)}</b><p style="margin:6px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word">${esc(x.msg)}</p><span>${ago(x.at)}</span></div></div>`).join(""):`<div class="card pad m">No feedback yet.</div>`}</div>`;
  $("#main").querySelectorAll("[data-fi]").forEach(c=>c.onclick=()=>detail(+c.dataset.fi))};
 const detail=i=>{const x=L[i];if(!x)return list();
  $("#main").innerHTML=`<div class=ph><div><button class="btn" id=fbback>← All feedback</button></div>${su()?`<button class="btn d" id=fbdel>${ic("trash",18)}Delete</button>`:""}</div><div class="card pad"><h1 style="margin:0 0 4px;font-size:20px">${esc(x.name||"")}</h1><p class="m sm" style="margin:0 0 12px">Group ${esc(x.g)} · Roll ${esc(x.roll)} · ${esc(new Date(x.at).toLocaleString())}</p><p style="white-space:pre-wrap;word-break:break-word;line-height:1.7;margin:0">${esc(x.msg)}</p></div>`;
  $("#fbback").onclick=list;
  const d=$("#fbdel");if(d)d.onclick=async()=>{if(!await confirmBox("Delete this feedback?","It will be removed permanently.","Delete",1))return;try{await api("/api/feedback/del",{id:+x.id});L.splice(i,1);list()}catch(e){toast(e.message,1)}}};
 list()}

(async()=>{R.innerHTML=`<div style="padding:26px 20px;max-width:960px;margin:0 auto">${skel()}</div>`;
 if(TK&&ME){try{return await start()}catch(e){if(!TK)return}}
 let st;try{st=await fetch(API+"/api/status").then(r=>r.json())}catch(e){return netErr()}
 st.ready?login():setup()})();
