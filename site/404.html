<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6fb">
<title>পেজটি পাওয়া যায়নি · Class Routine</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face{font-family:"ShurjoWeb";font-weight:400;font-display:swap;src:url("/ShurjoWeb_400.woff2") format("woff2")}
@font-face{font-family:"ShurjoWeb";font-weight:700;font-display:swap;src:url("/ShurjoWeb_700.woff2") format("woff2")}
@font-face{font-family:"Redaction";font-weight:700;font-display:swap;src:url("/Redaction_700.woff2") format("woff2")}
:root{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e5e9f2;--accent:#4f46e5;--soft:#eef0ff;
--grad:linear-gradient(135deg,#4f46e5 0%,#6d5ef0 55%,#7c3aed 100%);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"ShurjoWeb",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
overflow:hidden;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;pointer-events:none}
body::before{width:360px;height:360px;background:#c7c2ff;top:-120px;left:-100px}
body::after{width:320px;height:320px;background:#a5f3fc;bottom:-120px;right:-90px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;
padding:34px 28px 28px;text-align:center;box-shadow:0 1px 2px rgba(30,41,90,.05),0 20px 50px rgba(30,41,90,.10);
animation:up .6s var(--ease) both}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:18px}
.brand img{width:26px;height:26px;border-radius:7px;object-fit:contain}
.art{width:210px;max-width:70%;height:auto;display:block;margin:0 auto 8px}
.art .pg{animation:float 4s ease-in-out infinite;transform-origin:center}
.art .q{animation:blink 2.4s ease-in-out infinite}
.code{font-family:"Redaction",Georgia,serif;font-size:64px;line-height:1;font-weight:700;letter-spacing:2px;
background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 10px}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
p{color:var(--muted);font-size:15px;line-height:1.65}
p.en{font-size:13px;margin-top:4px}
.btns{display:grid;gap:12px;margin-top:24px}
/* secondary: same as the site's weekly-routine row button */
.wkb{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);
 cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 8px 20px -16px rgba(79,70,229,.5);transition:transform .18s ease,border-color .2s ease}
.wkb:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wkb:active{transform:scale(.985)}
.wkb:focus-visible{outline:3px solid rgba(139,92,246,.4);outline-offset:2px}
.wkb svg{width:22px;height:22px;color:var(--accent);flex:0 0 auto}
.wkb span{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.wkb b{font-size:14.5px;font-weight:800}
.wkb small{font-size:11.5px;color:var(--muted)}
.wkb .chev{width:18px;height:18px;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.art{width:150px}.code{font-size:48px}.card{padding:24px 22px 22px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="/logo.png" alt="" onerror="this.remove()">ক্লাস রুটিন</div>

  <svg class="art" viewBox="0 0 220 150" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    </defs>
    <ellipse cx="110" cy="138" rx="62" ry="7" fill="#e3e6f3"/>
    <g class="pg">
      <rect x="52" y="22" width="116" height="104" rx="16" fill="#fff" stroke="#e5e9f2" stroke-width="2"/>
      <path d="M52 38a16 16 0 0 1 16-16h84a16 16 0 0 1 16 16v10H52z" fill="url(#g)"/>
      <rect x="78" y="12" width="8" height="22" rx="4" fill="#312e81"/>
      <rect x="134" y="12" width="8" height="22" rx="4" fill="#312e81"/>
      <g fill="#eef0ff">
        <rect x="66" y="60" width="18" height="14" rx="4"/><rect x="91" y="60" width="18" height="14" rx="4"/>
        <rect x="116" y="60" width="18" height="14" rx="4"/><rect x="141" y="60" width="13" height="14" rx="4"/>
        <rect x="66" y="80" width="18" height="14" rx="4"/><rect x="141" y="80" width="13" height="14" rx="4"/>
        <rect x="66" y="100" width="18" height="14" rx="4"/><rect x="91" y="100" width="18" height="14" rx="4"/>
        <rect x="116" y="100" width="18" height="14" rx="4"/><rect x="141" y="100" width="13" height="14" rx="4"/>
      </g>
      <g class="q">
        <circle cx="112" cy="88" r="17" fill="#fff" stroke="url(#g)" stroke-width="3"/>
        <path d="M106 83.5a6 6 0 1 1 8.6 5.4c-1.7.8-2.6 1.9-2.6 3.6" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
        <circle cx="112" cy="97" r="1.9" fill="#4f46e5"/>
      </g>
    </g>
  </svg>

  <div class="code">404</div>
  <h1>পেজটি খুঁজে পাওয়া যায়নি</h1>
  <p>আপনি যে লিংকে এসেছেন সেটি হয়তো ভুল, অথবা পেজটি সরিয়ে ফেলা হয়েছে।</p>
  <p class="en">The page you're looking for doesn't exist or has moved.</p>

  <div class="btns">
    <button class="wkb" type="button" id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span><b>আগের পেজে ফিরে যান</b><small>যেখান থেকে এসেছিলেন</small></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</main>
<script>
(function(){
  var b=document.getElementById("back");
  b.onclick=function(){if(history.length>1&&document.referrer){history.back()}else{location.href="/"}}
})();
</script>
</body>
</html>
